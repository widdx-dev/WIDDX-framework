name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # 2.7: the full suite runs against every driver we claim to support
        # out of the box. sqlsrv/oci are best-effort only (see README).
        db: [sqlite, mysql, pgsql]

    # Real database servers, always up; the job picks one via DB_CONNECTION.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: widdxpass
          MYSQL_DATABASE: widdx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwiddxpass"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: widdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }} (${{ matrix.db }})
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none
          ini-values: session.save_path=/tmp

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Point the suite at ${{ matrix.db }}
        env:
          WIDDX_DB: ${{ matrix.db }}
        run: |
          {
            echo "WIDDX_ALLOW_DESTRUCTIVE_TEST_DB=1"
            echo "DB_CONNECTION=$WIDDX_DB"
            echo "DB_HOST=127.0.0.1"
            case "$WIDDX_DB" in
              mysql) echo "DB_PORT=3306"; echo "DB_DATABASE=widdx_test"; echo "DB_USERNAME=root"; echo "DB_PASSWORD=widdxpass";;
              pgsql) echo "DB_PORT=5432"; echo "DB_DATABASE=widdx_test"; echo "DB_USERNAME=postgres"; echo "DB_PASSWORD=";;
            esac
          } >> "$GITHUB_ENV"

      - name: Lint every PHP file
        run: |
          find . \( -name '*.php' -o -name 'widdx' -o -name 'widdx-test' \) -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Unit + integration suite
        run: php widdx-test

  # E6: the suite must also run INSIDE a project built with the framework, not only
  # here. A real project owns app/ and views/, and its models reference classes a fresh
  # scaffold never receives — copying the host's demo files into the scaffold used to
  # break seven scenarios that way. This leg fails if the suite ever reads app/ or
  # views/ off its own root again.
  inside-a-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: none
          ini-values: session.save_path=/tmp

      - name: Scaffold a project, then run the suite from inside it
        run: |
          php widdx new portable
          cd portable
          php widdx migrate
          php widdx test

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit 512M --no-progress
