name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: session.save_path=/tmp

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint every PHP file
        run: |
          find . \( -name '*.php' -o -name 'widdx' -o -name 'widdx-test' \) -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Unit + integration suite
        run: php widdx-test

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit 512M --no-progress
