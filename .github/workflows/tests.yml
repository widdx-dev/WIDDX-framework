name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # 2.7: the full suite runs against every driver we claim to support
        # out of the box. sqlsrv/oci are best-effort only (see README).
        db: [sqlite, mysql, pgsql]

    # Real database servers, always up; the job picks one via DB_CONNECTION.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: widdxpass
          MYSQL_DATABASE: widdx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwiddxpass"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: widdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }} (${{ matrix.db }})
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none
          ini-values: session.save_path=/tmp

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Point the suite at ${{ matrix.db }}
        env:
          WIDDX_DB: ${{ matrix.db }}
        run: |
          {
            echo "WIDDX_ALLOW_DESTRUCTIVE_TEST_DB=1"
            echo "DB_CONNECTION=$WIDDX_DB"
            echo "DB_HOST=127.0.0.1"
            case "$WIDDX_DB" in
              mysql) echo "DB_PORT=3306"; echo "DB_DATABASE=widdx_test"; echo "DB_USERNAME=root"; echo "DB_PASSWORD=widdxpass";;
              pgsql) echo "DB_PORT=5432"; echo "DB_DATABASE=widdx_test"; echo "DB_USERNAME=postgres"; echo "DB_PASSWORD=";;
            esac
          } >> "$GITHUB_ENV"

      - name: Lint every PHP file
        run: |
          find . \( -name '*.php' -o -name 'widdx' -o -name 'widdx-test' \) -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Verify destructive database reset fails closed without opt-in
        run: |
          set +e
          output="$(env -u WIDDX_ALLOW_DESTRUCTIVE_TEST_DB DB_CONNECTION=mysql DB_DATABASE=widdx_test php widdx-test 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 2
          echo "$output" | grep -q "Refusing destructive database reset"

      - name: Unit + integration suite
        run: php widdx-test

  # E6: the suite must also run INSIDE a project built with the framework, not only
  # here. A real project owns app/ and views/, and its models reference classes a fresh
  # scaffold never receives — copying the host's demo files into the scaffold used to
  # break seven scenarios that way. This leg fails if the suite ever reads app/ or
  # views/ off its own root again.
  inside-a-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: none
          ini-values: session.save_path=/tmp

      - name: Scaffold a project, then run the suite from inside it
        run: |
          php widdx new portable
          cd portable
          php widdx migrate
          php widdx test

      - name: Apache shared-hosting rewrite smoke test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2
          sudo a2enmod rewrite
          sudo mkdir -p /var/www/html/portable
          sudo cp -a "$GITHUB_WORKSPACE/portable/." /var/www/html/portable/
          printf 'rewrite-ok\\n' | sudo tee /var/www/html/portable/public/__apache_rewrite_probe.txt >/dev/null
          printf 'APP_SECRET=must-not-be-served\\n' | sudo tee /var/www/html/portable/.env >/dev/null
          sudo sed -i 's#DocumentRoot /var/www/html#DocumentRoot /var/www/html/portable#' /etc/apache2/sites-available/000-default.conf
          sudo tee -a /etc/apache2/apache2.conf >/dev/null <<'APACHE'
          <Directory /var/www/html/portable>
              AllowOverride All
              Require all granted
          </Directory>
          APACHE
          sudo apachectl configtest
          sudo systemctl restart apache2

          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/__apache_rewrite_probe.txt || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 1
          done

          body="$(curl --fail --silent --show-error http://127.0.0.1/__apache_rewrite_probe.txt)"
          test "$body" = "rewrite-ok"

          env_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/.env)"
          test "$env_status" = "403"

          source_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/core/App.php)"
          test "$source_status" = "403"

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit 512M --no-progress
